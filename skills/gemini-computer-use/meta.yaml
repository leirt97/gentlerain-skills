display-name-zh: Gemini 自动界面操作
version: 0.4.2
tag-en: Platform Tools
tag-cn: 平台工具
summary-en: Automatically delegate browser and native-app UI work needed by the current task to one independent Gemini task, handling dispatch, recovery and verification without delegation prompts.
summary-cn: 会话需要界面操作时自动交给独立 Gemini 任务，由主任务完成派发、跟进、恢复和验收，无需用户点名或确认委派。
complete-tags-en: [Platform Tools]
complete-tags-cn: [平台工具]
desc-en: When a ChatGPT/Codex Desktop task needs browser or native-application UI work, the main task automatically creates or reuses one independent Gemini task under the live host tool contract. The user does not need to invoke the skill, select a model, confirm delegation or direct individual actions. The operator handles UI actions, recovery and evidence within one initial attempt and at most one retry. The main task follows progress, resolves recoverable blocks and validates the outcome. Only inputs or steps that genuinely cannot be completed automatically require user participation.
desc-cn: 在 ChatGPT/Codex Desktop 中，会话任务需要浏览器或原生应用界面操作时，主任务按实时工具契约自动创建或复用独立 Gemini 任务。用户无需点名技能、选择模型、确认委派或逐步指挥。操作任务负责 UI 执行、恢复和证据，累计一次初始尝试和至多一次重试；主任务跟进进度、解决可恢复阻塞并验收结果。只有确实无法自动完成的输入或步骤，才需要用户参与。
source: community
