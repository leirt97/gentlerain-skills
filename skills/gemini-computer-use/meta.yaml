display-name-zh: Gemini 界面操作委派
version: 0.4.1
tag-en: Platform Tools
tag-cn: 平台工具
summary-en: Delegate authorized UI operations to one visible Gemini task without repeated confirmation, reusing existing authorization and respecting the host's task-creation requirements.
summary-cn: 将已授权的界面操作交给独立 Gemini 任务，沿用已有授权，无需二次确认；按平台条件创建或复用任务，由主任务验收。
complete-tags-en: [Platform Tools]
complete-tags-cn: [平台工具]
desc-en: This skill coordinates authorized browser and native-application work in ChatGPT/Codex Desktop through one independent Gemini task. It carries forward visible user authorization without adding a second confirmation step. Creating a task still requires the user's explicit request under the host contract; unmet requirements are reported as a block. The same operator owns UI actions, recovery and evidence, with one initial attempt and at most one retry. The main task owns communication and business acceptance.
desc-cn: 这项技能在 ChatGPT/Codex Desktop 中，将已授权的浏览器和原生应用操作交给独立 Gemini 任务。沿用可见的用户授权，不增加二次确认；创建任务仍以用户明确的新建任务请求为依据，不满足平台条件时报告阻塞。同一操作任务负责 UI 执行、恢复和证据，累计一次初始尝试和至多一次重试，主任务负责沟通与业务验收。
source: community
